name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Run `pulci start ...`
        2. Edit file ...
        3. Run `pulci status --json`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: pulci version
      placeholder: "(see pulci --version)"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: "Ubuntu 24.04, Python 3.12"
    validations:
      required: true
