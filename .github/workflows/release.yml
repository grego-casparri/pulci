name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # id-token: write is granted at the publish job level only (OIDC trusted publishing)

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux2014 Docker container: Python lives at /opt/python/cpXXX/bin/,
          # not in $PATH, so we pass --interpreter explicitly.
          - os: ubuntu-latest
            manylinux: auto
            args: >-
              --release --out dist
              --interpreter
              /opt/python/cp310-cp310/bin/python
              /opt/python/cp311-cp311/bin/python
              /opt/python/cp312-cp312/bin/python
              /opt/python/cp313-cp313/bin/python
          # musllinux falls back to host build where /usr/bin/python3 is in PATH.
          - os: ubuntu-latest
            manylinux: musllinux_1_2
            args: --release --out dist
          - os: macos-latest
            target: universal2-apple-darwin
            args: --release --out dist
          - os: windows-latest
            args: --release --out dist

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # pyo3 0.22.x supports up to Python 3.13; runners may have 3.14 pre-installed.
          # This flag instructs pyo3 to use the stable ABI and proceed anyway.
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          command: build
          args: ${{ matrix.args }}
          manylinux: ${{ matrix.manylinux || '' }}
          target: ${{ matrix.target || '' }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.manylinux || matrix.target || 'native' }}
          path: dist

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  test-wheels:
    name: Smoke test wheels (${{ matrix.os }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-${{ matrix.os }}-*
          merge-multiple: true
          path: dist
      - name: Install from wheel
        run: pip install --find-links dist pulci
      - name: Smoke test
        run: |
          python -c "import pulci._native; print('native module ok')"
          pulci --version

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
