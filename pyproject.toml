[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pulci"
version = "0.0.1"
description = "Continuous quality gate daemon for agent-driven Python development."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Grego Casparri", email = "gregocasparri@gmail.com" }]
keywords = ["quality-gates", "linting", "agent", "ai", "daemon", "rust", "ruff", "code-quality", "file-watcher", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12,<1",
]

[project.scripts]
pulci = "pulci.cli:app"

[project.urls]
Homepage = "https://github.com/grego-casparri/pulci"
Repository = "https://github.com/grego-casparri/pulci"
Issues = "https://github.com/grego-casparri/pulci/issues"
Documentation = "https://github.com/grego-casparri/pulci/blob/main/docs/AGENTS.md"

[tool.maturin]
manifest-path = "crates/pulci-py/Cargo.toml"
python-source = "python"
module-name = "pulci._native"
features = ["pyo3/extension-module"]
strip = true
include = [
    { path = "LICENSE", format = ["sdist"] },
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[dependency-groups]
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=8",
    "ruff>=0.7",
]
